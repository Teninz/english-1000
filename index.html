<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShadowFox Eng</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#14171C">
<meta name="apple-mobile-web-app-title" content="ShadowFox">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Палитра ShadowFox: уголь меха, ржавый шарф, янтарь глаза, жёлтый лист. Тёмная тема — основная (бренд), светлая — по выбору. */
:root{
  --ground:#14171C; --surface:#1F232B; --surface-2:#2A2F39; --line:#383E4A;
  --ink:#F1ECE3; --muted:#A3A8B3; --faint:#5F6573;
  --accent:#E8853A; --accent-ink:#1A1007; --accent-soft:#3B2515; --accent-deep:#F4B070;
  --amber:#EFA537; --leaf:#F2C230;
  --good:#7BC47F; --good-soft:#1F3323; --bad:#E36A5C; --bad-soft:#3C1F1C; --warn:#F2C230; --warn-soft:#3C3212;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35);
  --glow:0 0 0 1px rgba(232,133,58,.25),0 10px 30px rgba(232,133,58,.18);
  --r:16px; --ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --word:"Fraunces","Iowan Old Style",Georgia,serif;
  --ground-rgb:20,23,28; --surface-rgb:31,35,43; --accent-rgb:232,133,58;
  --sky1:#181C24; --sky2:#3E2C33; --sky3:#8A4E2A; --hill1:#111419; --hill2:#20262F; --hill3:#343C4A; --moon:#F1ECE3; --road:#2B2F38; --sand:#5A4630; --water:#2C3E52; --figure:#0B0D11; --orb:#F1ECE3; --cloud:#F1ECE3;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --ground:#F6F1EA; --surface:#FFFFFF; --surface-2:#EFE7DC; --line:#DDD2C4;
  --ink:#1E2229; --muted:#6A6F7A; --faint:#A9ADB5;
  --accent:#D9722E; --accent-ink:#FFFFFF; --accent-soft:#F8E4D3; --accent-deep:#A64D22;
  --amber:#D48F1F; --leaf:#C99A12;
  --good:#2F8F4E; --good-soft:#E1F2E6; --bad:#C94F4F; --bad-soft:#F8E3E1; --warn:#C99A12; --warn-soft:#FBF0C7;
  --shadow:0 1px 2px rgba(30,34,41,.06),0 6px 20px rgba(30,34,41,.07);
  --glow:0 0 0 1px rgba(217,114,46,.25),0 10px 30px rgba(217,114,46,.15);
  --ground-rgb:246,241,234; --surface-rgb:255,255,255; --accent-rgb:217,114,46;
  --sky1:#D6E6F2; --sky2:#F0D8BC; --sky3:#E9B274; --hill1:#A88E72; --hill2:#C7B295; --hill3:#DFCFB8; --moon:#FFFFFF; --road:#B9AA96; --sand:#E9D4A9; --water:#9FC3D6; --figure:#5A4636; --orb:#FFC847; --cloud:#FFFFFF;
  color-scheme:light;
}
*{box-sizing:border-box}
:root{--sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + var(--sat)) 18px 6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--word);font-size:22px;font-weight:600;letter-spacing:-.01em}
.brand img{width:46px;height:46px;object-fit:contain;margin:-6px 0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.brand small{font-family:var(--ui);font-weight:700;font-size:11px;color:var(--accent-ink);background:var(--accent);padding:2px 7px;border-radius:6px;letter-spacing:.06em;text-transform:uppercase;margin-left:2px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
main{flex:1;padding:8px 16px calc(96px + var(--sab));display:flex;flex-direction:column;gap:14px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sab);z-index:5}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 8px;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.01em}
.tab svg{width:24px;height:24px;padding:3px 12px;border-radius:99px;box-sizing:content-box;transition:background .15s}
.tab.active{color:var(--accent)}
.tab.active svg{background:var(--accent-soft)}
main > *{animation:rise .28s ease-out both}
main > *:nth-child(2){animation-delay:.04s} main > *:nth-child(3){animation-delay:.08s} main > *:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* плитки уровней */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--word);font-size:19px;font-weight:600;color:var(--muted);position:relative;border:2px solid transparent}
.tile .tb{width:60%;height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.tile .tb i{display:block;height:100%;background:var(--accent)}
.tile.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tile.full{color:var(--amber)} .tile.full .tb i{background:var(--amber)}
.tile-name{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px}
.tile-name b{font-weight:600}
/* переворот карточки */
.flip-wrap{perspective:1200px}
.flash{transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1)}
.flash.flipped{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px 20px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.flash .back{transform:rotateY(180deg)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card.hero{background:radial-gradient(120% 90% at 100% 0%,var(--accent-soft) 0%,var(--surface) 55%);border:1px solid var(--line)}
.card.hero{position:relative;overflow:hidden}
.hero-fox{position:absolute;right:-24px;bottom:-34px;height:210px;pointer-events:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
.card.hero{padding:18px 16px 22px;min-height:190px}
.card.hero .row{position:relative;z-index:1;padding-right:96px;align-items:flex-start}
.ring-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.card.hero .ring{width:74px;height:74px}
.card.hero .ring .lab{font-size:15px}
.card.hero h2{font-size:19px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:var(--accent-ink);min-height:48px;transition:transform .08s,box-shadow .15s;box-shadow:var(--glow)}
.btn:not(.ghost):not(.secondary){box-shadow:var(--glow),0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:active{transform:translateY(2px);box-shadow:var(--glow),0 1px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.secondary{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn.ghost{background:transparent;color:var(--accent-deep);padding:10px 12px;min-height:40px;box-shadow:none}
.btn.block{width:100%}
.btn.huge{min-height:76px;font-size:20px;border-radius:18px}
.btn[disabled]{opacity:.45;pointer-events:none}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-deep),var(--accent));border-radius:99px;transition:width .4s}
.bar.good > i{background:var(--good)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{width:92px;height:92px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .track{stroke:var(--surface-2)}
.ring .fill{stroke:var(--amber);transition:stroke-dashoffset .6s}
.ring .lab{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.ring .lab small{display:block;font-size:10px;color:var(--muted);text-align:center;font-weight:500}
.days{display:flex;gap:4px;align-items:flex-end;height:44px}
.days i{flex:1;background:var(--surface-2);border-radius:3px;min-height:3px;position:relative}
.days i.on{background:linear-gradient(180deg,var(--amber),var(--accent))}
.days i.today{outline:2px solid var(--accent);outline-offset:1px}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--leaf)}
.chip.accent{background:var(--accent-soft);color:var(--accent-deep)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.s1{background:var(--leaf)} .dot.s2{background:var(--accent)} .dot.s3{background:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.modes{display:grid;gap:10px}
.mode{display:flex;align-items:stretch;gap:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:0;text-align:left;width:100%;overflow:hidden}
.mode .ic-zone{display:flex;align-items:center;padding:14px 14px 14px 16px;flex:none}
.mode .grow{padding:12px 16px 12px 14px;border-left:2px solid var(--accent);background:linear-gradient(90deg,rgba(var(--accent-rgb),.18),rgba(var(--accent-rgb),.06) 60%,rgba(var(--accent-rgb),.03));display:flex;flex-direction:column;justify-content:center}
body.scenic .mode .grow{background:linear-gradient(90deg,rgba(var(--accent-rgb),.22),rgba(var(--accent-rgb),.08) 60%,rgba(var(--accent-rgb),.04))}
.mode .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;flex:none;border:1px solid rgba(var(--accent-rgb),.25)}
.mode .ic svg{width:22px;height:22px}
.mode b{display:block;font-weight:600}
.mode span{font-size:13px;color:var(--muted)}
.mode.off{opacity:.5}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
select.sel{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);appearance:none}
.sess-top{display:flex;align-items:center;gap:12px}
.sess-top .bar{flex:1}
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:26px 20px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.q .ask{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.word{font-family:var(--word);font-size:40px;font-weight:600;letter-spacing:-.01em;line-height:1.1;overflow-wrap:anywhere;color:var(--ink)}
.q .word,.flash .word,.hf .word{background:linear-gradient(135deg,var(--ink) 40%,var(--accent-deep));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.word.md{font-size:30px}
.pos{font-size:12px;color:var(--muted);font-style:italic}
.ru{font-size:22px;font-weight:500}
.ex{font-size:15px;color:var(--muted);max-width:34ch;line-height:1.5}
mark{background:var(--accent-soft);color:var(--accent-deep);border-radius:4px;padding:0 3px}
.ex-ru{font-size:14px;color:var(--muted);max-width:34ch;line-height:1.45;margin-top:-6px;font-style:italic}
.gap{font-family:var(--word);font-size:22px;line-height:1.5;max-width:30ch}
.gap u{text-decoration:none;border-bottom:2px solid var(--accent);padding:0 14px;color:var(--accent)}
.speak{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.speak svg{width:26px;height:26px}
.speak.big{width:88px;height:88px}
.speak.big svg{width:40px;height:40px}
.mic{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-deep));box-shadow:var(--glow);color:var(--accent-ink);display:grid;place-items:center;position:relative;flex:none}
.mic svg{width:44px;height:44px}
.mic.on{background:var(--bad)}
.mic.on::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--bad);opacity:.5;animation:pulse 1.2s infinite}
.mic[disabled]{opacity:.4}
@keyframes pulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.heard{font-size:15px;color:var(--muted)}
.heard b{color:var(--ink);font-family:var(--word);font-size:20px;font-weight:600}
.opts{display:grid;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;font-size:17px;font-weight:500;min-height:54px;display:flex;align-items:center;gap:12px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
/* «клавиши»: слой света сверху, тёмное ребро снизу, при нажатии проседают */
.opt,body.scenic .opt{--edge:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.08);border-bottom-color:rgba(0,0,0,.4);
  background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 40%,rgba(0,0,0,.16)),var(--surface);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.25),0 5px 0 var(--edge),0 12px 20px rgba(0,0,0,.4);transform:translateY(0);transition:transform .1s,box-shadow .1s,border-color .15s,background .2s}
body.scenic .opt{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,0) 40%,rgba(0,0,0,.18)),rgba(var(--surface-rgb),.92)}
:root[data-theme="light"] .opt,:root[data-theme="light"] body.scenic .opt{--edge:#C9B9A5;border-color:rgba(255,255,255,.7);border-bottom-color:#D8CBB9;box-shadow:inset 0 1px 0 #fff,0 4px 0 var(--edge),0 10px 18px rgba(60,40,20,.15)}
.opt:hover{border-color:rgba(var(--accent-rgb),.6)}
.opt:active:not([disabled]),.opt.pressed{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 0 var(--edge),0 3px 8px rgba(0,0,0,.3)}
.opt .k{background:linear-gradient(180deg,var(--surface-2),rgba(0,0,0,.15)),var(--surface-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.35);color:var(--accent-deep)}
.opt.ok,body.scenic .opt.ok{border-color:var(--good);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.1)),var(--good-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 0 var(--edge),0 0 0 3px rgba(123,196,127,.25),0 10px 18px rgba(0,0,0,.3)}
.opt.no,body.scenic .opt.no{border-color:var(--bad);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.1)),var(--bad-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 0 var(--edge),0 0 0 3px rgba(227,106,92,.25),0 10px 18px rgba(0,0,0,.3)}
.opt[disabled]:not(.ok):not(.no){transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 2px 0 var(--edge),0 4px 8px rgba(0,0,0,.25)}
.opts{gap:14px;padding-bottom:6px}
.match{gap:14px}
.opt.dim{opacity:.4}
.opt .k{width:24px;height:24px;border-radius:7px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.type-in{width:100%;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:22px;text-align:center;font-family:var(--word)}
.type-in.ok{border-color:var(--good)} .type-in.no{border-color:var(--bad)}
.fb{border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.fb.ok{background:var(--good-soft);color:var(--good)} .fb.no{background:var(--bad-soft);color:var(--bad)}
.fb b{font-size:16px} .fb .ans{color:var(--ink);font-weight:500}
.fb .ans small{color:var(--muted);font-weight:400}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{justify-content:center;text-align:center;min-height:60px;font-size:16px}
.match .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.match .opt.done{opacity:.25;pointer-events:none}
.match .opt.en{font-family:var(--word);font-size:19px}
.flash{position:relative;min-height:320px;text-align:center}
.flash .hidden-part{display:flex;flex-direction:column;align-items:center;gap:10px}
.tap{font-size:13px;color:var(--faint)}
.res-list{display:grid;gap:8px}
.res-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.res-item .w{font-family:var(--word);font-size:18px;font-weight:600}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.lvl{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.lvl-h{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.lvl-h .n{font-family:var(--word);font-size:20px;font-weight:600;width:34px;color:var(--accent);font-variant-numeric:tabular-nums}
.lvl-h b{display:block;font-weight:600}
.lvl-h .bar{margin-top:6px;height:5px}
.lvl-h .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.wl{border-top:1px solid var(--line)}
.wrow{display:flex;align-items:center;gap:12px;padding:11px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .en{font-family:var(--word);font-size:18px;font-weight:600;flex:none;min-width:40%}
.wrow .tr{font-size:14px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* режим «В дороге» */
.flagb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);flex:none;transition:transform .15s,color .15s,background .15s}
.flagb svg{width:18px;height:18px}
.flagb.big{width:52px;height:52px} .flagb.big svg{width:22px;height:22px}
.flagb.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);box-shadow:var(--glow)}
.flagb:active{transform:scale(.9)}
.hardmark{display:inline-block;width:12px;height:12px;margin-left:6px;color:var(--accent);vertical-align:-1px}
.hardmark svg{width:12px;height:12px}

<script>
/* ---------- данные ---------- */
const WORDS = [...WORDS_A, ...WORDS_B];
const LEVEL_SIZE = 50;
const LEVEL_NAMES = ["Мнение и мышление","Работа и карьера","Бизнес и финансы","Образование и наука","Технологии","Общество и право","Здоровье и медицина","Окружающая среда","Характер и отношения","Общение и аргументация","Путешествия и транспорт","Дом и быт","Еда и кухня","Покупки и услуги","Искусство и медиа","Прилагательные","Глаголы","Фразовые глаголы","Наречия и связки","Абстрактные понятия"];
const POS = {n:"сущ.",v:"глаг.",adj:"прил.",adv:"нареч.",prep:"предлог",pron:"местоим.",conj:"союз",num:"числ.",det:"определитель",int:"междом."};
const INTERVALS = [0,1,3,7,14,30,60]; // дни до следующего показа по ячейкам 0..6
const levelOf = i => Math.floor(i / LEVEL_SIZE);
const wk = i => WORDS[i][0]; // ключ прогресса — само слово, чтобы правки списка не ломали прогресс

/* ---------- состояние ---------- */
const KEY = "shadowfox.v2";
const dayStr = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today = () => dayStr(new Date());
const addDays = (s,n) => { const d = new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return dayStr(d); };
let S;
const W = i => S.w[wk(i)];
const status = i => { const r = W(i); if(!r) return 0; if(r.box>=6) return 3; if(r.box>=3) return 2; return 1; };
const STATUS_LABEL = ["не начато","учу","знаю","закреплено"];
function dayRec(){ const t = today(); return S.days[t] || (S.days[t] = {n:0,q:0,ok:0,bad:0}); }
function touchStreak(){
  const t = today();
  if(S.streak.last === t) return;
  S.streak.n = (S.streak.last === addDays(t,-1)) ? S.streak.n+1 : 1;
  S.streak.last = t;
}
function grade(i, ok, mode, assisted = false){
  const previous = W(i), day = today();
  const remembered = ok && !assisted && previous && previous.ok > 0 && previous.due <= day && previous.lastAttempt !== day;
  S.w[wk(i)] = LearningCore.schedule(previous,ok,day,addDays,assisted);
  const d = dayRec(); d.q++; ok ? d.ok++ : d.bad++;
  d.words=d.words||{}; d.words[wk(i)]=1;

function listen(lang, timeout = 8000){

    if(!SR){ res({error:"unsupported"}); return; }
    const r = new SR(); r.lang = lang; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    let done = false, t;
    const fin = v => { if(done) return; done = true; clearTimeout(t); currentRec = null; try{ r.abort(); }catch(e){} res(v); };

function matchAny(alts, targets, lang = "en"){
  if(!lang.startsWith("ru")) return alts.some(a=>targets.some(t=>LearningCore.englishMatch(a,t)));
  for(const a of alts){ const na = norm(a); if(!na) continue;
    for(const t of targets){ if(!t) continue;

      if(t.length >= 4 && lev(na, t) <= Math.max(1, Math.floor(t.length * 0.2))) return true;

      if(t.length >= 6 && na.split(" ").some(tok => tok.length >= 5 && tok.slice(0, t.length-3) === t.slice(0, t.length-3))) return true;
    } }

}

let hfMode = "listen", hfScope = "new", hfLevel = 0;

const CMD = {
  ru: { skip:["дальше","далее","пропустить","пропуск","следующее","следующий","не знаю","незнаю"], repeat:["повтори","повторить","ещё раз","еще раз","повтор"], stop:["стоп","пауза","хватит","остановись","остановить"], example:["пример"], hint:["перевод","подсказка"] },

function findCmd(alts, lang){
  const set = CMD[lang]; for(const a of alts){ const na = norm(a); for(const [c, ws] of Object.entries(set)) if(ws.some(w => na === w || na.startsWith(w+" ") || na.endsWith(" "+w))) return c; } return null;
}

function hfPool(){
  if(hfScope==="new"){ const un = unstartedList(); if(!un.length) return []; const l = levelOf(un[0]); return un.filter(i=>levelOf(i)===l).slice(0, 10); }
  if(hfScope==="due") return sample(dueList(), 20);
  if(hfScope==="hard") return sample(hardList(), 20);
  if(hfScope==="all") return sample(startedList(), 20);
  return sample(allIdx().filter(i=>levelOf(i)===hfLevel), 20);
}
async function hfStart(){
  const pool = hfPool(); if(!pool.length){ toast("В этой выборке нет слов"); return; }
  hf.on = true; hf.paused = false; hf.token++; hf.queue = pool; hf.k = 0; hf.res = []; inSession = true;
  try { hf.lock = await navigator.wakeLock?.request("screen"); } catch(e){ hf.lock = null; }
  hfScreen(); hfLoop(hf.token);
}
function hfStop(){ hf.on = false; hf.token++; stopListening(); if(hf.lock){ try{ hf.lock.release(); }catch(e){} hf.lock = null; } }
function hfScreen(){
  view().innerHTML = `
    <div class="sess-top"><button class="icon-btn" id="sx" aria-label="Выйти">${ICONS.close}</button><div class="bar"><i id="hfBar" style="width:0%"></i></div><span class="small muted num" id="hfCnt"></span></div>
    <div class="hf" id="hfBox"><div class="status" id="hfStatus"><i></i><span>Готово</span></div><div class="word" id="hfWord"></div><div class="ru" id="hfRu"></div><p class="ex" id="hfEx"></p><div class="heard" id="hfHeard"></div></div>
    <div class="grid2"><button class="btn secondary huge" id="hfPause">${ICONS.pause.replace("<svg","<svg width=28 height=28")} Пауза</button><button class="btn huge" id="hfNext">${ICONS.next.replace("<svg","<svg width=28 height=28")} Дальше</button></div>
    <p class="small muted" style="text-align:center">${hfMode==="listen"?"После примера — сигнал и 4 секунды на «дальше», «повтори» или «стоп»":"Говори после сигнала «блинь». «Дальше» — пропустить, «повтори» — ещё раз, «стоп» — пауза"}</p>
  `;
  $("#sx").onclick = () => { endSession(); go("road"); };
  $("#hfPause").onclick = hfTogglePause;
  $("#hfNext").onclick = () => { hf.skip = true; stopListening(); TTS.stop(); };
}
function hfSet(status, cls, word, ru, ex, heard){
  const st = $("#hfStatus"); if(!st) return;
  st.className = "status " + (cls||""); st.querySelector("span").textContent = status;
  if(word!==undefined) $("#hfWord").textContent = word; if(ru!==undefined) $("#hfRu").textContent = ru; if(ex!==undefined) $("#hfEx").textContent = ex; if(heard!==undefined) $("#hfHeard").innerHTML = heard;
  $("#hfCnt").textContent = `${Math.min(hf.k+1, hf.queue.length)}/${hf.queue.length}`; $("#hfBar").style.width = (hf.k/hf.queue.length*100)+"%";
}
function hfTogglePause(){
  hf.paused = !hf.paused; const b = $("#hfPause"); if(!b) return;
  b.innerHTML = (hf.paused ? ICONS.play : ICONS.pause).replace("<svg","<svg width=28 height=28") + (hf.paused ? " Продолжить" : " Пауза");
  if(hf.paused){ stopListening(); TTS.stop(); hfSet("Пауза"); }
}
async function hfWaitIfPaused(token){ while(hf.paused && hf.token===token) await sleep(200); }
async function hfSay(text, lang, token){ if(hf.token!==token || hf.skip) return; hfSet(lang.startsWith("ru")?"Говорю по-русски":"Говорю", "speaking"); await speakAsync(text, lang); }
async function hfLoop(token){
  while(hf.on && hf.token===token && hf.k < hf.queue.length){
    await hfWaitIfPaused(token); if(hf.token!==token) return;
    const i = hf.queue[hf.k], w = WORDS[i]; hf.skip = false;
    if(hfMode==="listen"){
      hfSet("Говорю","speaking", w[0], w[1], w[3], "");
      await hfSay(w[0], "en-US", token); await sleep(500);
      await hfSay(w[1], "ru-RU", token); await sleep(400);
      await hfSay(w[3], "en-US", token);
      if(hf.token!==token) return;
      if(!W(i)) introduce(i, false); checkAch("heard", {i}); dailyEvent("heard");
      // короткое окно для команд, если распознавание доступно
      if(canListen() && !hf.skip && !hf.paused){ hfSet("Слушаю команду","listening"); cue("listen"); await sleep(260); const r = await listen("ru-RU", 4000); const c = r.alts ? findCmd(r.alts,"ru") : null;
        if(c==="stop"){ hfTogglePause(); continue; } if(c==="repeat"){ continue; } }
      else await sleep(900);
      hf.k++; continue;
    }
    const askLang = hfMode==="ru" ? "en-US" : "ru-RU", ansLang = hfMode==="ru" ? "ru-RU" : "en-US", cmdLang = hfMode==="ru" ? "ru" : "en";
    const prompt = hfMode==="ru" ? w[0] : w[1];
    const targets = hfMode==="ru" ? variants(w[1]) : [norm(w[0])];
    hfSet("Говорю","speaking", hfMode==="ru" ? w[0] : "", hfMode==="ru" ? "" : w[1], "", "");
    await hfSay(prompt, askLang, token); if(hf.token!==token) return;
    let tries = 0, resolved = false;
    while(!resolved && hf.token===token){
      await hfWaitIfPaused(token); if(hf.token!==token) return;
      if(hf.skip){ resolved = true; await hfAnswer(i, false, w, token, "пропущено"); break; }
      hfSet("Слушаю ответ","listening"); cue("listen"); await sleep(260);
      const r = await listen(ansLang, 7000);
      if(hf.token!==token) return;
      if(r.error && r.error!=="no-speech" && r.error!=="aborted"){ hfSet("Микрофон недоступен", "no", undefined, undefined, undefined, esc(REC_ERRORS[r.error] || r.error)); await speakAsync("Микрофон недоступен", "ru-RU"); hfTogglePause(); break; }
      const alts = r.alts || [];
      const c = findCmd(alts, cmdLang);
      if(c==="stop"){ hfTogglePause(); continue; }
      if(c==="repeat"){ await hfSay(prompt, askLang, token); continue; }
      if(c==="example"){ await hfSay(w[3], "en-US", token); continue; }
      if(c==="hint" || c==="skip"){ resolved = true; await hfAnswer(i, false, w, token, c==="hint"?"подсказка":"пропущено"); break; }
      if(!alts.length){ tries++; if(tries>=2){ resolved = true; await hfAnswer(i, false, w, token, "нет ответа"); break; } await hfSay(hfMode==="ru"?"Ещё раз: ":"Once more: ", ansLang, token); await hfSay(prompt, askLang, token); continue; }
      const ok = matchAny(alts, targets, cmdLang);
      $("#hfHeard").innerHTML = `Услышано: <b>${esc(alts[0])}</b>`;
      resolved = true; await hfAnswer(i, ok, w, token, null);
    }
    if(hf.token!==token) return;
    hf.k++;
  }
  if(hf.on && hf.token===token) hfFinish();
}
async function hfAnswer(i, ok, w, token, note){
  if(!hf.res.some(x=>x.i===i)){ hf.res.push({i, ok}); grade(i, ok, hfMode==="en" ? "pron" : "voice"); if(ok && hfMode==="en") dailyEvent("pronOk"); }
  hfSet(ok ? "Верно" : (note||"Неверно"), ok ? "ok" : "no", w[0], w[1]); cue(ok ? "ok" : "no");
  if(ok) await speakAsync(hfMode==="ru" ? "Верно" : "Correct", hfMode==="ru" ? "ru-RU" : "en-US");
  else { await speakAsync(w[0], "en-US"); await sleep(300); await speakAsync(w[1], "ru-RU"); }
  await sleep(600);
}
async function hfFinish(){
  hf.on = false; inSession = false; if(hf.lock){ try{ hf.lock.release(); }catch(e){} hf.lock=null; }
  const n = hf.res.length, ok = hf.res.filter(x=>x.ok).length;
  if(hfMode==="listen"){ await speakAsync("Порция закончена", "ru-RU"); go("road"); toast("Прослушано: "+plural(hf.queue.length,"слово","слова","слов")); return; }
  await speakAsync(`Готово. Верно ${ok} из ${n}`, "ru-RU");
  sess = {title: hfMode==="ru" ? "Голосом: перевод" : "Голосом: слово", items: hf.queue, mode: hfMode==="en"?"pron":"voice", k:0, res: hf.res.map(x=>({...x, kind: hfMode==="en"?"pron":"voice"})), after:"road"};
  showResults(); $("#rAgain").onclick = () => go("road");
}

    <div class="set-row" style="flex-direction:column;align-items:stretch;gap:8px"><span>Перенос прогресса на другое устройство</span><textarea class="io" id="io" placeholder="Вставь сюда код с другого устройства"></textarea><div class="grid2"><button class="btn secondary" id="exp">Скопировать код</button><button class="btn secondary" id="imp">Загрузить</button></div><p class="small muted">Копия содержит прогресс и лису. API-ключи и настройки голосов не включаются.</p><div class="backup-tools"><button class="btn secondary" id="backupFile">Сохранить копию в файл</button><label class="small">Загрузить файл копии<input type="file" id="importFile" accept=".json,application/json,text/plain" style="display:block;width:100%;margin-top:6px"></label><button class="btn ghost" id="undoImport">Восстановить копию до импорта</button></div></div>
    <div class="set-row" style="flex-direction:column;align-items:stretch;gap:8px"><div class="row between"><span>Прогресс</span><span class="small muted">начато ${plural(started,"слово","слова","слов")} · сложных ${hardList().length}</span></div>
      <div class="grid2"><button class="btn secondary" id="resetProg">${ICONS.reset.replace("<svg","<svg width=16 height=16")} Сбросить изученное</button><button class="btn secondary" id="resetHard">${ICONS.flag.replace("<svg","<svg width=16 height=16")} Снять все пометки</button></div>
      <p class="small muted">Сброс изученного обнуляет слова, серию дней и статистику, но сохраняет настройки, голоса, ключи и пометки «сложное». Сбросить один уровень можно во вкладке «Слова».</p></div>
    <div class="set-row"><span>О приложении</span><button class="btn ghost" id="aboutBtn">Версия ${APP_VERSION} ›</button></div>
    <div class="set-row"><span class="small muted">Распознавание речи: ${canListen()?"есть":"нет"}.</span><button class="btn ghost" id="reset" style="color:var(--bad)">Сбросить всё</button></div>
  `);
  $("#goalSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.goal=+b.dataset.g; save(); settingsSheet(); });
  $("#tAuto").onclick = () => { S.set.auto=!S.set.auto; save(); settingsSheet(); };
  $("#tRemind").onclick = () => { S.set.remind = S.set.remind ? null : ($("#remindTime").value || "19:00"); save(); if(window.scheduleReminder) scheduleReminder(); settingsSheet(); };
  $("#remindTime").onchange = e => { S.set.remind = e.target.value; save(); if(window.scheduleReminder) scheduleReminder(); };
  $("#themeSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.set.theme=b.dataset.t; save(); applyTheme(); settingsSheet(); });
  $("#widgetSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.set.widgetTheme=b.dataset.w; save(); if(window.updateWidget) updateWidget(true); settingsSheet(); });
  $("#scenePick").querySelectorAll(".scene-btn").forEach(b=>b.onclick=()=>{ S.set.scene=b.dataset.s; save(); applyScene(); settingsSheet(); });
  $("#tMotion").onclick = () => { S.set.motion = S.set.motion===false; save(); applyScene(); settingsSheet(); };
  $("#tGlass").onclick = () => { S.set.glass = S.set.glass===false; save(); applyScene(); settingsSheet(); };
  const rerenderVoices = () => { const p = $("#voicesPanel"); if(!p) return; p.innerHTML = voicesPanel(); wireVoicesPanel(rerenderVoices); };
  wireVoicesPanel(rerenderVoices);
  if(Object.values(S.set.tts||{}).some(c=>c.engine==="piper") && !TTS.piperStored) TTS.piperList().then(rerenderVoices).catch(()=>{});
  wireProgressStorage();
  $("#aboutBtn").onclick = aboutSheet;
  $("#resetProg").onclick = () => confirmSheet("Сбросить изученное?", `${plural(started,"слово","слова","слов")} вернутся в «не начато». Настройки и пометки останутся.`, "Сбросить", () => { resetProgress(); go("home"); toast("Прогресс сброшен"); }, true);
  $("#resetHard").onclick = () => confirmSheet("Снять все пометки «сложное»?", `Сейчас помечено ${plural(hardList().length,"слово","слова","слов")}.`, "Снять", () => { S.hard = {}; save(); settingsSheet(); toast("Пометки сняты"); });
  $("#reset").onclick = () => confirmSheet("Удалить весь прогресс?", "Это нельзя отменить. Ключи и скачанные голоса останутся.", "Удалить", () => { const keep = {tts:S.set.tts, ttsKeys:S.set.ttsKeys}; try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+".before-import");}catch(e){toast("Не удалось сбросить данные");return;} load(); Object.assign(S.set, keep); save(); if(window.resetCompanion)window.resetCompanion(); go("home"); }, true);
}
function applyScene(){
  const k = S.set.scene || "town"; const layer = $("#scene");
  layer.innerHTML = SCENE_SVG[k] ? SCENE_SVG[k]() : "";
  document.body.classList.toggle("scenic", !!SCENE_SVG[k]);
  document.body.classList.toggle("still", S.set.motion===false);
  document.body.classList.toggle("noglass", S.set.glass===false);
  if(typeof checkAch==="function" && S.stats) checkAch("scene", {scene:k});
}
function applyTheme(){ const t = S.set.theme||"dark"; if(t==="light") document.documentElement.setAttribute("data-theme","light"); else document.documentElement.removeAttribute("data-theme"); document.querySelector('meta[name="theme-color"]').content = t==="light" ? "#F6F1EA" : "#14171C"; if(typeof checkAch==="function" && S.stats) checkAch("theme", {theme:t}); }
// окно подтверждения внутри приложения: системный confirm() во встроенных браузерах блокируется
function confirmSheet(title, text, yes, onYes, danger){
  sheet(`<h2>${esc(title)}</h2><p class="muted">${esc(text)}</p><div class="grid2" style="margin-top:4px"><button class="btn secondary" data-close>Остаться</button><button class="btn" id="cfYes" style="${danger?"background:var(--bad);color:#fff;box-shadow:none":""}">${esc(yes)}</button></div>`);
  $("#cfYes").onclick = () => { closeSheet(); onYes(); };
}
function sheet(html){ $("#overlay").innerHTML = `<div class="scrim"><div class="sheet">${html}</div></div>`; $(".scrim").onclick = e => { if(e.target===e.currentTarget) closeSheet(); }; $("[data-close]").onclick = closeSheet; }
function closeSheet(){ $("#overlay").innerHTML = ""; }
$("#btnSettings").onclick = settingsSheet;
$("#foxHandle").innerHTML=foxFaceIcon();
$("#foxHandle").onclick=()=>openCompanion();
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&companionDrawerOpen())closeCompanion();});

/* ---------- старт ---------- */
load();
// демо-режим для скриншотов магазина: ?demo=1&screen=… — данные не сохраняются
const qsDemo = new URLSearchParams(location.search);
if(qsDemo.get("zoom")) document.documentElement.style.zoom = qsDemo.get("zoom");
if(qsDemo.get("demo")){ save = () => {}; document.head.appendChild(Object.assign(document.createElement("style"),{textContent:"*{transition:none!important;animation:none!important}"})); S.set.scene = qsDemo.get("scene") || "town"; S.set.theme = qsDemo.get("theme") || "dark"; S.set.motion = false;
  const d = dayRec(); d.n = 6; d.q = 18; d.ok = 16; S.streak.n = 4; S.streak.last = today();
  [3,5,2,7,9,4,6,8,5,7,10,6,9,8].forEach((v,k) => { S.days[addDays(today(),k-13)] = {n:v,q:v*2,ok:v*2-1,bad:1}; }); S.days[today()] = d;
  allIdx().filter(i=>levelOf(i)<3).forEach((i,k) => { S.w[wk(i)] = {box:(k*5)%7,due:today(),ok:2,bad:0}; });
  allIdx().filter(i=>levelOf(i)===3).slice(0,20).forEach(i => { S.w[wk(i)] = {box:1,due:today(),ok:1,bad:1}; });
  [4,9,15,22,31].forEach(i => S.hard[wk(i)] = 1); }
applyTheme(); applyScene(); pickVoices(); go("home");
if(qsDemo.get("demo")){ const sc = qsDemo.get("screen"); setTimeout(() => {
  if(sc==="card"){ go("learn"); learnLevel = 13; startLearnBatch(allIdx().filter(i=>levelOf(i)===13).slice(0,5)); setTimeout(()=>$("#flash").classList.add("flipped"), 300); }
  else if(sc==="quiz"){ go("test"); testScope = "level"; testLevel = 0; launchTest("mc"); }
  else if(sc==="gap"){ go("test"); testScope = "level"; testLevel = 17; launchTest("gap"); }
  else if(sc==="road"){ go("road"); }
  else if(sc==="words"){ go("words"); openLevel = 0; drawWords(); }
  else if(sc==="settings"){ settingsSheet(); }
  else if(sc) go(sc); }, 200); }
document.addEventListener("visibilitychange", () => {if(document.visibilityState==="visible" && !inSession && tab==="home")go("home");});
document.addEventListener("visibilitychange", thematicOnVisible);
document.addEventListener("visibilitychange", async () => { if(document.visibilityState==="visible" && hf.on && !hf.lock){ try{ hf.lock = await navigator.wakeLock?.request("screen"); }catch(e){} } });
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
