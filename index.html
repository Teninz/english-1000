<style>
:root{
  --ground:#F2F5F7; --surface:#FFFFFF; --surface-2:#E9EEF2; --line:#D6DEE4;
  --ink:#16202B; --muted:#65727F; --faint:#A3AEB8;
  --accent:#1F6F8B; --accent-ink:#FFFFFF; --accent-soft:#E0EEF3; --accent-deep:#164F63;
  --good:#2E8B57; --good-soft:#E1F2E8; --bad:#C94F4F; --bad-soft:#F8E3E3; --warn:#D08A2E; --warn-soft:#FBEEDB;
  --shadow:0 1px 2px rgba(22,32,43,.06),0 6px 20px rgba(22,32,43,.06);
  --r:14px; --ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --word:"Fraunces","Iowan Old Style",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1519; --surface:#182027; --surface-2:#1F2931; --line:#2C3841;
    --ink:#E9EEF2; --muted:#93A0AC; --faint:#5C6873;
    --accent:#58B4CF; --accent-ink:#0B1A20; --accent-soft:#1B3540; --accent-deep:#8BD0E3;
    --good:#4FBF7F; --good-soft:#173125; --bad:#E06B6B; --bad-soft:#3A1F1F; --warn:#E3A24B; --warn-soft:#3A2C17;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1519; --surface:#182027; --surface-2:#1F2931; --line:#2C3841;
  --ink:#E9EEF2; --muted:#93A0AC; --faint:#5C6873;
  --accent:#58B4CF; --accent-ink:#0B1A20; --accent-soft:#1B3540; --accent-deep:#8BD0E3;
  --good:#4FBF7F; --good-soft:#173125; --bad:#E06B6B; --bad-soft:#3A1F1F; --warn:#E3A24B; --warn-soft:#3A2C17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.brand{font-family:var(--word);font-size:22px;font-weight:600;letter-spacing:-.01em}
.brand small{font-family:var(--ui);font-weight:500;font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:.06em;text-transform:uppercase}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
main{flex:1;padding:8px 16px 96px;display:flex;flex-direction:column;gap:14px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 8px;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.01em}
.tab svg{width:24px;height:24px;padding:3px 12px;border-radius:99px;box-sizing:content-box;transition:background .15s}
.tab.active{color:var(--accent)}
.tab.active svg{background:var(--accent-soft)}
main > *{animation:rise .28s ease-out both}
main > *:nth-child(2){animation-delay:.04s} main > *:nth-child(3){animation-delay:.08s} main > *:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* плитки уровней */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--word);font-size:19px;font-weight:600;color:var(--muted);position:relative;border:2px solid transparent}
.tile .tb{width:60%;height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.tile .tb i{display:block;height:100%;background:var(--accent)}
.tile.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tile.full{color:var(--good)} .tile.full .tb i{background:var(--good)}
.tile-name{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px}
.tile-name b{font-weight:600}
/* переворот карточки */
.flip-wrap{perspective:1200px}
.flash{transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1);position:relative}
.flash.flipped{transform:rotateY(180deg)}
.flash .face{backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.flash .back{position:absolute;inset:0;padding:30px 20px;justify-content:center;transform:rotateY(180deg)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:48px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--surface-2);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--accent);padding:10px 12px;min-height:40px}
.btn.block{width:100%}
.btn.huge{min-height:76px;font-size:20px;border-radius:18px}
.btn[disabled]{opacity:.45;pointer-events:none}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.good > i{background:var(--good)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{width:92px;height:92px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .track{stroke:var(--surface-2)}
.ring .fill{stroke:var(--accent);transition:stroke-dashoffset .6s}
.ring .lab{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.ring .lab small{display:block;font-size:10px;color:var(--muted);text-align:center;font-weight:500}
.days{display:flex;gap:4px;align-items:flex-end;height:44px}
.days i{flex:1;background:var(--surface-2);border-radius:3px;min-height:3px;position:relative}
.days i.on{background:var(--accent)}
.days i.today{outline:2px solid var(--accent);outline-offset:1px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.accent{background:var(--accent-soft);color:var(--accent-deep)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.s1{background:var(--warn)} .dot.s2{background:var(--accent)} .dot.s3{background:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.modes{display:grid;gap:10px}
.mode{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;text-align:left;width:100%}
.mode .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;flex:none}
.mode .ic svg{width:22px;height:22px}
.mode b{display:block;font-weight:600}
.mode span{font-size:13px;color:var(--muted)}
.mode.off{opacity:.5}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
select.sel{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);appearance:none}
.sess-top{display:flex;align-items:center;gap:12px}
.sess-top .bar{flex:1}
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:26px 20px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.q .ask{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.word{font-family:var(--word);font-size:40px;font-weight:600;letter-spacing:-.01em;line-height:1.1;overflow-wrap:anywhere}
.word.md{font-size:30px}
.pos{font-size:12px;color:var(--muted);font-style:italic}
.ru{font-size:22px;font-weight:500}
.ex{font-size:15px;color:var(--muted);max-width:34ch;line-height:1.5}
.ex mark{background:var(--accent-soft);color:var(--accent-deep);border-radius:4px;padding:0 3px}
.gap{font-family:var(--word);font-size:22px;line-height:1.5;max-width:30ch}
.gap u{text-decoration:none;border-bottom:2px solid var(--accent);padding:0 14px;color:var(--accent)}
.speak{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;flex:none}
.speak svg{width:26px;height:26px}
.speak.big{width:88px;height:88px}
.speak.big svg{width:40px;height:40px}
.mic{width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;position:relative;flex:none}
.mic svg{width:44px;height:44px}
.mic.on{background:var(--bad)}
.mic.on::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--bad);opacity:.5;animation:pulse 1.2s infinite}
.mic[disabled]{opacity:.4}
@keyframes pulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.heard{font-size:15px;color:var(--muted)}
.heard b{color:var(--ink);font-family:var(--word);font-size:20px;font-weight:600}
.opts{display:grid;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;font-size:17px;font-weight:500;min-height:54px;display:flex;align-items:center;gap:12px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.4}
.opt .k{width:24px;height:24px;border-radius:7px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.type-in{width:100%;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:22px;text-align:center;font-family:var(--word)}
.type-in.ok{border-color:var(--good)} .type-in.no{border-color:var(--bad)}
.fb{border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.fb.ok{background:var(--good-soft);color:var(--good)} .fb.no{background:var(--bad-soft);color:var(--bad)}
.fb b{font-size:16px} .fb .ans{color:var(--ink);font-weight:500}
.fb .ans small{color:var(--muted);font-weight:400}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{justify-content:center;text-align:center;min-height:60px;font-size:16px}
.match .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.match .opt.done{opacity:.25;pointer-events:none}
.match .opt.en{font-family:var(--word);font-size:19px}
.flash{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:30px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:300px;justify-content:center}
.flash .hidden-part{display:flex;flex-direction:column;align-items:center;gap:10px}
.tap{font-size:13px;color:var(--faint)}
.res-list{display:grid;gap:8px}
.res-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.res-item .w{font-family:var(--word);font-size:18px;font-weight:600}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.lvl{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.lvl-h{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.lvl-h .n{font-family:var(--word);font-size:20px;font-weight:600;width:34px;color:var(--accent);font-variant-numeric:tabular-nums}
.lvl-h b{display:block;font-weight:600}
.lvl-h .bar{margin-top:6px;height:5px}
.lvl-h .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.wl{border-top:1px solid var(--line)}
.wrow{display:flex;align-items:center;gap:12px;padding:11px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .en{font-family:var(--word);font-size:18px;font-weight:600;flex:none;min-width:40%}
.wrow .tr{font-size:14px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* режим «В дороге» */
.hf{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:340px;justify-content:center}
.hf .status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hf .status i{width:10px;height:10px;border-radius:50%;background:var(--faint)}
.hf .status.speaking i{background:var(--accent)}
.hf .status.listening i{background:var(--bad);animation:blink 1s infinite}
.hf .status.ok{color:var(--good)} .hf .status.no{color:var(--bad)}
@keyframes blink{50%{opacity:.3}}
.hf .word{font-size:44px}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;color:var(--muted)}
.cmds b{color:var(--ink);font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:18px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.toggle{width:46px;height:28px;border-radius:99px;background:var(--surface-2);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.toggle.on{background:var(--accent)} .toggle.on::after{left:21px}
textarea.io{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:10px;font-size:12px;font-family:ui-monospace,Consolas,monospace}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;z-index:30;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:500}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ---------- данные ---------- */
const WORDS = [...WORDS_A, ...WORDS_B];
const LEVEL_SIZE = 50;
const LEVEL_NAMES = ["Мнение и мышление","Работа и карьера","Бизнес и финансы","Образование и наука","Технологии","Общество и право","Здоровье и медицина","Окружающая среда","Характер и отношения","Общение и аргументация","Путешествия и транспорт","Дом и быт","Еда и кухня","Покупки и услуги","Искусство и медиа","Прилагательные","Глаголы","Фразовые глаголы","Наречия и связки","Абстрактные понятия"];
const POS = {n:"сущ.",v:"глаг.",adj:"прил.",adv:"нареч.",prep:"предлог",pron:"местоим.",conj:"союз",num:"числ.",det:"определитель",int:"междом."};
const INTERVALS = [0,1,3,7,14,30,60]; // дни до следующего показа по ячейкам 0..6
const levelOf = i => Math.floor(i / LEVEL_SIZE);
const wk = i => WORDS[i][0]; // ключ прогресса — само слово, чтобы правки списка не ломали прогресс

/* ---------- состояние ---------- */
const KEY = "tysyacha.v2";
const dayStr = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today = () => dayStr(new Date());
const addDays = (s,n) => { const d = new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return dayStr(d); };
let S;
function load(){
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e){ S = null; }
  if(!S || S.v !== 2) S = { v:2, goal:10, streak:{n:0,last:null}, days:{}, w:{}, modes:{}, set:{auto:true} };
}

function dayRec(){ const t = today(); return S.days[t] || (S.days[t] = {n:0,q:0,ok:0,bad:0}); }
function touchStreak(){
  const t = today();
  if(S.streak.last === t) return;
  S.streak.n = (S.streak.last === addDays(t,-1)) ? S.streak.n+1 : 1;
  S.streak.last = t;
}
function grade(i, ok, mode){
  const r = W(i) || (S.w[wk(i)] = {box:0,due:today(),ok:0,bad:0});
  if(ok){ r.ok++; r.box = Math.min(6, r.box+1); } else { r.bad++; r.box = Math.max(0, r.box-2); }
  r.due = addDays(today(), INTERVALS[r.box]);
  const d = dayRec(); d.q++; ok ? d.ok++ : d.bad++;
  if(mode){ const m = S.modes[mode] || (S.modes[mode]={ok:0,bad:0}); ok ? m.ok++ : m.bad++; }
  touchStreak(); save();
}
function introduce(i, known){
  if(!W(i)) { S.w[wk(i)] = {box: known?6:0, due: addDays(today(), known?60:0), ok:0, bad:0}; dayRec().n++; touchStreak(); }
  else if(known){ W(i).box = 6; W(i).due = addDays(today(),60); }
  save();
}

const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

let enVoice = null, ruVoice = null;
const voicesFor = lang => canSpeak() ? speechSynthesis.getVoices().filter(v => new RegExp("^"+lang, "i").test(v.lang)).sort((a,b)=>a.name.localeCompare(b.name)) : [];
// голос по умолчанию: сохранённый выбор → «хороший» системный → любой для языка
function pickVoices(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  const saved = (key, lang) => S && S.set[key] ? vs.find(v => v.voiceURI === S.set[key] || v.name === S.set[key]) : null;
  enVoice = saved("enVoice","en") || vs.find(v=>/^en[-_]US/i.test(v.lang) && /Google|Samantha|Natural|Aria|Jenny/i.test(v.name)) || vs.find(v=>/^en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
  ruVoice = saved("ruVoice","ru") || vs.find(v=>/^ru/i.test(v.lang) && /Google|Milena|Natural|Svetlana|Dmitry/i.test(v.name)) || vs.find(v=>/^ru/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged = pickVoices; }
const canSpeak = () => "speechSynthesis" in window;
const rateFor = lang => (S.set.rate || 1) * (lang.startsWith("ru") ? 1 : 0.88);
function speak(text, lang="en-US"){
  if(!canSpeak()) { toast("Озвучка недоступна в этом браузере"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = rateFor(lang);
  const v = lang.startsWith("ru") ? ruVoice : enVoice; if(v) u.voice = v;
  speechSynthesis.speak(u);
}
// озвучка с ожиданием конца — для режима «В дороге»
function speakAsync(text, lang="en-US"){
  return new Promise(res => {
    if(!canSpeak() || !text){ res(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = rateFor(lang) * 0.96;
    const v = lang.startsWith("ru") ? ruVoice : enVoice; if(v) u.voice = v;
    let done = false; const fin = () => { if(!done){ done = true; res(); } };
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
    setTimeout(fin, Math.max(2500, text.length * 130)); // страховка: в Chrome onend иногда не приходит
  });
}

/* ---------- распознавание речи ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const canListen = () => !!SR;
let currentRec = null;
// слушает один раз, возвращает {alts:[...]} или {error}
function listen(lang, timeout = 8000){
  return new Promise(res => {
    if(!SR){ res({error:"unsupported"}); return; }
    const r = new SR(); r.lang = lang; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    let done = false, t;
    const fin = v => { if(done) return; done = true; clearTimeout(t); currentRec = null; try{ r.abort(); }catch(e){} res(v); };
    r.onresult = e => { const alts = []; for(const rs of e.results) for(let k=0;k<rs.length;k++) alts.push(rs[k].transcript); fin({alts}); };
    r.onerror = e => fin({error: e.error || "error"});
    r.onend = () => fin({alts:[]});
    t = setTimeout(() => fin({alts:[]}), timeout);
    try { r.start(); currentRec = r; } catch(e){ fin({error:"start"}); }
  });
}
function stopListening(){ if(currentRec){ try{ currentRec.abort(); }catch(e){} currentRec = null; } }
const REC_ERRORS = {
  "not-allowed":"Нет доступа к микрофону. Разреши микрофон для этого сайта в настройках браузера.",
  "service-not-allowed":"Браузер запретил распознавание речи. Попробуй открыть приложение в Chrome или Safari.",
  "network":"Распознавание речи требует интернета.",
  "audio-capture":"Микрофон не найден.",
  "unsupported":"В этом браузере нет распознавания речи. Работает в Chrome (Android) и Safari (iPhone).",
  "aborted":"", "no-speech":"", "start":"Не удалось включить микрофон, попробуй ещё раз."
};
const variants = s => s.replace(/\([^)]*\)/g,"").split(/[,;/]/).map(norm).filter(Boolean);
// совпало ли что-то из распознанных вариантов с одним из целевых
function matchAny(alts, targets){
  for(const a of alts){ const na = norm(a); if(!na) continue;
    for(const t of targets){ if(!t) continue;
      if(na === t) return true;
      if(t.length >= 3 && new RegExp("(^| )"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"( |$)").test(na)) return true;
      if(t.length >= 4 && lev(na, t) <= Math.max(1, Math.floor(t.length * 0.2))) return true;
      // русская форма слова может отличаться окончанием («допускаю» vs «допускать») — сравниваем основу
      if(t.length >= 6 && na.split(" ").some(tok => tok.length >= 5 && tok.slice(0, t.length-3) === t.slice(0, t.length-3))) return true;
    } }
  return false;
}

function hl(sentence, word){
  const re = wordRegex(word); const m = sentence.match(re);

}
// ищет слово в примере с учётом простых окончаний; у фразовых глаголов окончание — у первого слова
function wordRegex(word){
  const parts = word.split(" ").map(p => p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  let stem = parts[0]; const raw = word.split(" ")[0];
  if(/[^aeiou]y$/i.test(raw)) stem = stem.slice(0,-1)+"(y|ie|i)"; else if(/e$/i.test(raw)) stem = stem.slice(0,-1)+"e?";
  const first = stem + "(s|es|ed|d|ing|er|est)?";
  return new RegExp("\\b" + [first, ...parts.slice(1)].join("\\s+") + "\\b", "i");
}

function distractors(i, n, field){

    ${needMic && !canListen() ? `<div class="note">${REC_ERRORS.unsupported} Режим «Слушать» работает везде.</div>` : ""}
    ${!canSpeak() ? `<div class="note">В этом браузере нет озвучки — режим не заработает.</div>` : ""}
    <button class="btn block huge" id="hfStart" ${(!canSpeak() || (needMic && !canListen()))?"disabled":""}>${ICONS.play.replace("<svg","<svg width=26 height=26")} Начать</button>
    <section class="card">
      <div class="eyebrow" style="margin-bottom:10px">Голосовые команды</div>
      <div class="cmds">
        <span><b>дальше</b> / next — пропустить</span><span><b>повтори</b> / repeat — ещё раз</span>
        <span><b>пример</b> / example — предложение</span><span><b>перевод</b> / hint — подсказка</span>
        <span><b>стоп</b> / stop — пауза</span><span>Команды на языке ответа</span>
      </div>
    </section>
  `;
  document.querySelectorAll(".mode").forEach(b => b.onclick = () => { hfMode = b.dataset.m; renderRoad(); });
  $("#hfScope").onchange = e => { hfScope = e.target.value; renderRoad(); };
  wireTiles(l => { hfLevel = l; renderRoad(); });
  $("#hfStart").onclick = hfStart;
}
function hfPool(){
  if(hfScope==="new"){ const un = unstartedList(); if(!un.length) return []; const l = levelOf(un[0]); return un.filter(i=>levelOf(i)===l).slice(0, 10); }
  if(hfScope==="due") return sample(dueList(), 20);
  if(hfScope==="all") return sample(startedList(), 20);
  return sample(allIdx().filter(i=>levelOf(i)===hfLevel), 20);
}
async function hfStart(){
  const pool = hfPool(); if(!pool.length){ toast("В этой выборке нет слов"); return; }
  hf.on = true; hf.paused = false; hf.token++; hf.queue = pool; hf.k = 0; hf.res = []; inSession = true;
  try { hf.lock = await navigator.wakeLock?.request("screen"); } catch(e){ hf.lock = null; }
  hfScreen(); hfLoop(hf.token);
}
function hfStop(){ hf.on = false; hf.token++; stopListening(); if(hf.lock){ try{ hf.lock.release(); }catch(e){} hf.lock = null; } }
function hfScreen(){
  view().innerHTML = `
    <div class="sess-top"><button class="icon-btn" id="sx" aria-label="Выйти">${ICONS.close}</button><div class="bar"><i id="hfBar" style="width:0%"></i></div><span class="small muted num" id="hfCnt"></span></div>
    <div class="hf" id="hfBox"><div class="status" id="hfStatus"><i></i><span>Готово</span></div><div class="word" id="hfWord"></div><div class="ru" id="hfRu"></div><p class="ex" id="hfEx"></p><div class="heard" id="hfHeard"></div></div>
    <div class="grid2"><button class="btn secondary huge" id="hfPause">${ICONS.pause.replace("<svg","<svg width=28 height=28")} Пауза</button><button class="btn huge" id="hfNext">${ICONS.next.replace("<svg","<svg width=28 height=28")} Дальше</button></div>
    <p class="small muted" style="text-align:center">${hfMode==="listen"?"Скажи «стоп» или «дальше» — если браузер поддерживает распознавание":"Отвечай после сигнала. «Дальше» — пропустить, «повтори» — ещё раз, «стоп» — пауза"}</p>
  `;
  $("#sx").onclick = () => { endSession(); go("road"); };
  $("#hfPause").onclick = hfTogglePause;
  $("#hfNext").onclick = () => { hf.skip = true; stopListening(); if(canSpeak()) speechSynthesis.cancel(); };
}
function hfSet(status, cls, word, ru, ex, heard){
  const st = $("#hfStatus"); if(!st) return;
  st.className = "status " + (cls||""); st.querySelector("span").textContent = status;
  if(word!==undefined) $("#hfWord").textContent = word; if(ru!==undefined) $("#hfRu").textContent = ru; if(ex!==undefined) $("#hfEx").textContent = ex; if(heard!==undefined) $("#hfHeard").innerHTML = heard;
  $("#hfCnt").textContent = `${Math.min(hf.k+1, hf.queue.length)}/${hf.queue.length}`; $("#hfBar").style.width = (hf.k/hf.queue.length*100)+"%";
}
function hfTogglePause(){
  hf.paused = !hf.paused; const b = $("#hfPause"); if(!b) return;
  b.innerHTML = (hf.paused ? ICONS.play : ICONS.pause).replace("<svg","<svg width=28 height=28") + (hf.paused ? " Продолжить" : " Пауза");
  if(hf.paused){ stopListening(); if(canSpeak()) speechSynthesis.cancel(); hfSet("Пауза"); }
}
async function hfWaitIfPaused(token){ while(hf.paused && hf.token===token) await sleep(200); }
async function hfSay(text, lang, token){ if(hf.token!==token || hf.skip) return; hfSet(lang.startsWith("ru")?"Говорю по-русски":"Говорю", "speaking"); await speakAsync(text, lang); }
async function hfLoop(token){
  while(hf.on && hf.token===token && hf.k < hf.queue.length){
    await hfWaitIfPaused(token); if(hf.token!==token) return;
    const i = hf.queue[hf.k], w = WORDS[i]; hf.skip = false;
    if(hfMode==="listen"){
      hfSet("Говорю","speaking", w[0], w[1], w[3], "");
      await hfSay(w[0], "en-US", token); await sleep(500);
      await hfSay(w[1], "ru-RU", token); await sleep(400);
      await hfSay(w[3], "en-US", token);
      if(hf.token!==token) return;
      if(!W(i)) introduce(i, false);
      // короткое окно для команд, если распознавание доступно
      if(canListen() && !hf.skip && !hf.paused){ hfSet("Слушаю команду","listening"); const r = await listen("ru-RU", 2500); const c = r.alts ? findCmd(r.alts,"ru") : null;
        if(c==="stop"){ hfTogglePause(); continue; } if(c==="repeat"){ continue; } }
      else await sleep(900);
      hf.k++; continue;
    }
    const askLang = hfMode==="ru" ? "en-US" : "ru-RU", ansLang = hfMode==="ru" ? "ru-RU" : "en-US", cmdLang = hfMode==="ru" ? "ru" : "en";
    const prompt = hfMode==="ru" ? w[0] : w[1];
    const targets = hfMode==="ru" ? variants(w[1]) : [norm(w[0])];
    hfSet("Говорю","speaking", hfMode==="ru" ? w[0] : "", hfMode==="ru" ? "" : w[1], "", "");
    await hfSay(prompt, askLang, token); if(hf.token!==token) return;
    let tries = 0, resolved = false;
    while(!resolved && hf.token===token){
      await hfWaitIfPaused(token); if(hf.token!==token) return;
      if(hf.skip){ resolved = true; await hfAnswer(i, false, w, token, "пропущено"); break; }
      hfSet("Слушаю ответ","listening");
      const r = await listen(ansLang, 7000);
      if(hf.token!==token) return;
      if(r.error && r.error!=="no-speech" && r.error!=="aborted"){ hfSet("Микрофон недоступен", "no", undefined, undefined, undefined, esc(REC_ERRORS[r.error] || r.error)); await speakAsync("Микрофон недоступен", "ru-RU"); hfTogglePause(); break; }
      const alts = r.alts || [];
      const c = findCmd(alts, cmdLang);
      if(c==="stop"){ hfTogglePause(); continue; }
      if(c==="repeat"){ await hfSay(prompt, askLang, token); continue; }
      if(c==="example"){ await hfSay(w[3], "en-US", token); continue; }
      if(c==="hint" || c==="skip"){ resolved = true; await hfAnswer(i, false, w, token, c==="hint"?"подсказка":"пропущено"); break; }
      if(!alts.length){ tries++; if(tries>=2){ resolved = true; await hfAnswer(i, false, w, token, "нет ответа"); break; } await hfSay(hfMode==="ru"?"Ещё раз: ":"Once more: ", ansLang, token); await hfSay(prompt, askLang, token); continue; }
      const ok = matchAny(alts, targets);
      $("#hfHeard").innerHTML = `Услышано: <b>${esc(alts[0])}</b>`;
      resolved = true; await hfAnswer(i, ok, w, token, null);
    }
    if(hf.token!==token) return;
    hf.k++;
  }
  if(hf.on && hf.token===token) hfFinish();
}
async function hfAnswer(i, ok, w, token, note){
  if(!hf.res.some(x=>x.i===i)){ hf.res.push({i, ok}); grade(i, ok, hfMode==="en" ? "pron" : "voice"); }
  hfSet(ok ? "Верно" : (note||"Неверно"), ok ? "ok" : "no", w[0], w[1]);
  if(ok) await speakAsync(hfMode==="ru" ? "Верно" : "Correct", hfMode==="ru" ? "ru-RU" : "en-US");
  else { await speakAsync(w[0], "en-US"); await sleep(300); await speakAsync(w[1], "ru-RU"); }
  await sleep(600);
}
async function hfFinish(){
  hf.on = false; inSession = false; if(hf.lock){ try{ hf.lock.release(); }catch(e){} hf.lock=null; }
  const n = hf.res.length, ok = hf.res.filter(x=>x.ok).length;
  if(hfMode==="listen"){ await speakAsync("Порция закончена", "ru-RU"); go("road"); toast("Прослушано: "+plural(hf.queue.length,"слово","слова","слов")); return; }
  await speakAsync(`Готово. Верно ${ok} из ${n}`, "ru-RU");
  sess = {title: hfMode==="ru" ? "Голосом: перевод" : "Голосом: слово", items: hf.queue, mode: hfMode==="en"?"pron":"voice", k:0, res: hf.res.map(x=>({...x, kind: hfMode==="en"?"pron":"voice"})), after:"road"};
  showResults(); $("#rAgain").onclick = () => go("road");
}

/* ---------- Слова ---------- */
let openLevel = null, query = "";
function renderWords(){
  view().innerHTML = `<input class="search" id="q" placeholder="Поиск по английскому или русскому" value="${esc(query)}"><div id="wlist" style="display:grid;gap:10px"></div>`;
  $("#q").oninput = e => { query = e.target.value; drawWords(); };
  drawWords();
}
function drawWords(){
  const box = $("#wlist"); const q = norm(query);
  if(q){
    const hits = allIdx().filter(i => norm(WORDS[i][0]).includes(q) || norm(WORDS[i][1]).includes(q)).slice(0,60);
    box.innerHTML = hits.length ? `<div class="lvl"><div class="wl">${hits.map(rowHtml).join("")}</div></div>` : `<div class="empty">Ничего не найдено</div>`;
  } else {
    box.innerHTML = LEVEL_NAMES.map((n,l)=>{ const ids = allIdx().filter(i=>levelOf(i)===l); const kn = ids.filter(i=>status(i)>=2).length;
      return `<div class="lvl"><button class="lvl-h" data-l="${l}"><span class="n">${l+1}</span><span class="grow"><b>${n}</b><div class="bar"><i style="width:${kn*2}%"></i></div></span><span class="cnt">${kn}/50</span></button>${openLevel===l?`<div class="wl">${ids.map(rowHtml).join("")}</div>`:""}</div>`; }).join("");
    box.querySelectorAll(".lvl-h").forEach(b => b.onclick = () => { openLevel = openLevel===+b.dataset.l ? null : +b.dataset.l; drawWords(); });
  }
  box.querySelectorAll(".wrow").forEach(b => b.onclick = () => wordSheet(+b.dataset.i));
}
const rowHtml = i => `<button class="wrow" data-i="${i}"><i class="dot s${status(i)}"></i><span class="en">${esc(WORDS[i][0])}</span><span class="tr">${esc(WORDS[i][1])}</span></button>`;
function wordSheet(i){
  const w = WORDS[i], r = W(i);
  sheet(`
    <div class="row between"><div class="pos">${POS[w[2]]||""} · уровень ${levelOf(i)+1} · <span class="chip ${status(i)===3?"good":status(i)===2?"accent":status(i)===1?"warn":""}">${STATUS_LABEL[status(i)]}</span></div><button class="icon-btn" data-close aria-label="Закрыть">${ICONS.close}</button></div>
    <div class="row"><div class="word md grow">${esc(w[0])}</div><button class="speak" id="ssp" aria-label="Озвучить">${ICONS.sound}</button></div>
    <div class="ru">${esc(w[1])}</div>
    <p class="ex">${hl(w[3], w[0])}</p>
    ${r?`<p class="small muted num">Верно ${r.ok} · ошибок ${r.bad} · следующий показ ${r.box>=6?"— закреплено":r.due<=today()?"сегодня":r.due}</p>`:""}
    <div class="grid2"><button class="btn secondary" id="sReset">${r?"Сбросить":"В изучение"}</button><button class="btn" id="sKnow">Уже знаю</button></div>
  `);
  $("#ssp").onclick = () => speak(w[0]);
  $("#sKnow").onclick = () => { introduce(i,true); closeSheet(); drawWords(); toast("Отмечено как известное"); };
  $("#sReset").onclick = () => { if(r){ delete S.w[wk(i)]; save(); } else introduce(i,false); closeSheet(); drawWords(); };
}

/* ---------- настройки ---------- */
function settingsSheet(){
  const started = startedList().length;
  sheet(`
    <div class="row between"><h2>Настройки</h2><button class="icon-btn" data-close aria-label="Закрыть">${ICONS.close}</button></div>
    <div class="set-row"><span>Новых слов в день</span><div class="seg" style="width:200px" id="goalSeg">${[5,10,15,20].map(g=>`<button class="${S.goal===g?"on":""}" data-g="${g}">${g}</button>`).join("")}</div></div>
    <div class="set-row"><span>Озвучивать слово автоматически</span><button class="toggle ${S.set.auto?"on":""}" id="tAuto" aria-label="Автоозвучка"></button></div>
    <div class="set-row"><span>Тема</span><div class="seg" style="width:200px" id="themeSeg">${[["auto","Система"],["light","Светлая"],["dark","Тёмная"]].map(([k,l])=>`<button class="${(S.set.theme||"auto")===k?"on":""}" data-t="${k}">${l}</button>`).join("")}</div></div>
    <div class="set-row" style="flex-direction:column;align-items:stretch;gap:10px">
      <div class="row between"><span>Голоса</span><span class="small muted">${canSpeak()?plural(speechSynthesis.getVoices().length,"голос","голоса","голосов")+" в системе":"озвучки нет"}</span></div>
      ${voiceRow("en","Английский", enVoice)}
      ${voiceRow("ru","Русский", ruVoice)}
      <div class="row"><span class="small grow">Скорость речи <b id="rateLab" class="num">${Math.round((S.set.rate||1)*100)}%</b></span><input type="range" id="rate" min="0.6" max="1.4" step="0.05" value="${S.set.rate||1}" style="width:160px;accent-color:var(--accent)"></div>
      <p class="small muted">Голоса бесплатные и берутся из системы. Добавить новые на Android: Настройки → Система → Язык и ввод → Преобразование текста в речь → Google → Установить голосовые данные (там есть британский, американский, австралийский английский, офлайн-варианты). На iPhone: Настройки → Универсальный доступ → Устный контент → Голоса.</p>
    </div>
    <div class="set-row" style="flex-direction:column;align-items:stretch;gap:8px"><span>Перенос прогресса на другое устройство</span><textarea class="io" id="io" placeholder="Вставь сюда код с другого устройства"></textarea><div class="grid2"><button class="btn secondary" id="exp">Скопировать код</button><button class="btn secondary" id="imp">Загрузить</button></div></div>
    <div class="set-row"><span class="small muted">Начато ${plural(started,"слово","слова","слов")}. Распознавание речи: ${canListen()?"есть":"нет"}.</span><button class="btn ghost" id="reset" style="color:var(--bad)">Сбросить всё</button></div>
  `);
  $("#goalSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.goal=+b.dataset.g; save(); settingsSheet(); });
  $("#tAuto").onclick = () => { S.set.auto=!S.set.auto; save(); settingsSheet(); };
  $("#themeSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.set.theme=b.dataset.t; save(); applyTheme(); settingsSheet(); });
  ["en","ru"].forEach(l => { const sel = $("#v_"+l); if(!sel) return;
    sel.onchange = () => { S.set[l+"Voice"] = sel.value || null; save(); pickVoices(); };
    $("#vt_"+l).onclick = () => speak(l==="en" ? "Practice makes perfect." : "Практика — путь к совершенству.", l==="en"?"en-US":"ru-RU"); });
  $("#rate").oninput = e => { S.set.rate = +e.target.value; $("#rateLab").textContent = Math.round(S.set.rate*100)+"%"; save(); };
  $("#exp").onclick = async () => { const code = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); $("#io").value = code; try{ await navigator.clipboard.writeText(code); toast("Код скопирован"); }catch(e){ $("#io").select(); toast("Скопируй код из поля"); } };
  $("#imp").onclick = () => { try{ const o = JSON.parse(decodeURIComponent(escape(atob($("#io").value.trim())))); if(o.v!==2) throw 0; S=o; save(); closeSheet(); go("home"); toast("Прогресс загружен"); }catch(e){ toast("Код не распознан"); } };
  $("#reset").onclick = () => { if(confirm("Удалить весь прогресс? Это нельзя отменить.")){ localStorage.removeItem(KEY); load(); closeSheet(); go("home"); } };
}
function voiceRow(lang, label, cur){
  const vs = voicesFor(lang); if(!vs.length) return `<div class="row between small muted"><span>${label}</span><span>нет голосов для языка</span></div>`;
  const opts = vs.map(v => `<option value="${esc(v.voiceURI)}" ${cur && v.voiceURI===cur.voiceURI?"selected":""}>${esc(v.name.replace(/^(Microsoft|Google) /,""))}${/^en/.test(lang)?" · "+v.lang.replace("_","-"):""}${v.localService?"":" · онлайн"}</option>`).join("");
  return `<div class="row"><span class="small" style="width:84px">${label}</span><select class="sel grow" id="v_${lang}" style="padding:9px 12px">${opts}</select><button class="speak" id="vt_${lang}" style="width:40px;height:40px" aria-label="Прослушать">${ICONS.sound.replace("<svg","<svg width=20 height=20")}</button></div>`;
}
function applyTheme(){ const t = S.set.theme||"auto"; if(t==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }
function sheet(html){ $("#overlay").innerHTML = `<div class="scrim"><div class="sheet">${html}</div></div>`; $(".scrim").onclick = e => { if(e.target===e.currentTarget) closeSheet(); }; $("[data-close]").onclick = closeSheet; }
function closeSheet(){ $("#overlay").innerHTML = ""; }
$("#btnSettings").onclick = settingsSheet;

/* ---------- старт ---------- */
load(); applyTheme(); pickVoices(); go("home");
document.addEventListener("visibilitychange", async () => { if(document.visibilityState==="visible" && hf.on && !hf.lock){ try{ hf.lock = await navigator.wakeLock?.request("screen"); }catch(e){} } });
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
